name: Build Budgie OS Based On Fedora 44 Bootc Image

on:
  schedule:
    - cron: "22 20 * * *" # 每天 CST 04:22 构建
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 清理 Runner 磁盘空间，防止镜像构建空间不足
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Packages (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送到 GHCR
      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/edwardwoodhub/my-budgie-vm:latest

      # 使用 bootc-image-builder 将 bootc 镜像生成为 ISO
      - name: Build Live/Install ISO using bootc-image-builder
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            -it \
            --privileged \
            --pull=newer \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --local \
            ghcr.io/edwardwoodhub/my-budgie-vm:latest

          # 寻找生成的 ISO 并重命名为统一名称
          sudo mv output/bootiso/*.iso ./my-budgie-live.iso
          sudo chown -R $USER:$USER ./my-budgie-live.iso

      # 将大于 2GB 的 ISO 切割为分卷文件（每个 1.5GB）
      - name: Split ISO
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          split -b 1500M my-budgie-live.iso my-budgie-live.iso.part-
          ls -lh my-budgie-live.iso.part-*

      # 发布切割后的 ISO 分卷到 GitHub Releases
      - name: Publish ISO to GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-iso-${{ github.sha }}
          name: "Budgie OS LiveISO (${{ github.sha }})"
          files: my-budgie-live.iso.part-*
          generate_release_notes: true
      
      # 登录阿里云 ACR
      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 使用 Skopeo 将镜像从 GHCR 镜像同步到阿里云 ACR
      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Syncing latest image layers to Aliyun ACR in compatibility mode..."
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://ghcr.io/edwardwoodhub/my-budgie-vm:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-budgie-vm:latest
