name: Build Budgie OS Based On Fedora 44 Bootc Image

on:
  schedule:
    - cron: "22 20 * * *" # 每天 CST 04:22 构建
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Generate ISO and Push Image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 清理 Runner 磁盘空间，防止镜像与 ISO 构建空间不足
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # 1. 使用 sudo podman 在本地构建 bootc 容器镜像（不直接推送）
      - name: Build Container Image locally with Podman
        run: |
          sudo podman build -t ghcr.io/edwardwoodhub/my-budgie-vm:latest -f ./Containerfile .

      # 2. 直接使用本地镜像生成 Live/Install ISO
      - name: Build Live/Install ISO using bootc-image-builder
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-budgie-vm:latest

          # 移动并重命名生成的 ISO
          sudo mv output/bootiso/*.iso ./my-budgie-live.iso
          sudo chown -R $USER:$USER ./my-budgie-live.iso

      # 3. 将大于 2GB 的 ISO 切割为分卷文件（每个 1.5GB）
      - name: Split ISO
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          split -b 1500M my-budgie-live.iso my-budgie-live.iso.part-
          ls -lh my-budgie-live.iso.part-*

      # 4. 发布切割后的 ISO 分卷到 GitHub Releases
      - name: Publish ISO to GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-iso-${{ github.sha }}-${{ github.run_number }}
          name: "Budgie OS LiveISO (${{ github.sha }}) [run #${{ github.run_number }}]"
          files: my-budgie-live.iso.part-*
          generate_release_notes: true

      # 5. 登录 GHCR 与 阿里云 ACR
      - name: Log in to Registries
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ -n "${{ secrets.ALIYUN_ACR_REGISTRY }}" ]; then
            echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | sudo podman login "${{ secrets.ALIYUN_ACR_REGISTRY }}" -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin
          fi

      # 6. 推送镜像到 GHCR
      - name: Push Container Image to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          sudo podman push ghcr.io/edwardwoodhub/my-budgie-vm:latest

      # 7. 打标签并推送到阿里云 ACR（使用 v2s2 格式以保证兼容性）
      - name: Push Container Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          ACR_IMAGE="${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-budgie-vm:latest"
          sudo podman tag ghcr.io/edwardwoodhub/my-budgie-vm:latest "$ACR_IMAGE"
          # 使用 v2s2 格式推送到阿里云以保证兼容
          sudo podman push --format v2s2 "$ACR_IMAGE"
