# ==============================================================================
# 镜像名称: my-budgie-onyx-vm
# 核心架构: Budgie 10.10 + Labwc (Wayland)
# 目标用户名: edward (UID: 1000)
# ==============================================================================

name: my-budgie-onyx-vm
description: 基于 Budgie 10.10 的自动远程办公系统，用户名预设为 edward
base-image: ghcr.io/ublue-os/onyx-main
image-version: latest

modules:
  # ------------------------------------------------------------
  # 1. 基础系统脚本：网络、防火墙、自动登录与用户驻留
  # ------------------------------------------------------------
  - type: script
    snippets:
      - dnf -y copr enable zhullyb/v2rayA
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      
      # 开启用户驻留 (Linger) - 确保用户服务在开机时即启动
      - loginctl enable-linger edward

      # 配置 SDDM 自动登录 (目标用户: edward)
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop
        EOF

      # 防火墙策略：放行 VNC (5900 端口)
      - firewall-offline-cmd --add-service=vnc-server

  # ------------------------------------------------------------
  # 2. 软件包安装 (rpm-ostree)
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      # Budgie 10.10 & Labwc 核心组件
      - labwc
      - budgie-desktop-services
      - libxfce4windowing
      - xdg-desktop-portal-wlr
      
      # 远程办公工具
      - wayvnc
      - control-port
      - swaylock
      - grim
      - slurp
      - wl-clipboard

      # 网络与虚拟机增强
      - open-vm-tools
      - open-vm-tools-desktop
      - v2raya
      - trojan
      - iptables
      - ipset

      # 基础工具
      - git
      - vim
      - wget
      - htop
      - fastfetch

  # ------------------------------------------------------------
  # 3. 配置文件与 GSchema 注入
  # ------------------------------------------------------------
  - type: script
    snippets:
      # A. 创建 WayVNC 用户服务文件
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC server for Budgie-Labwc
        After=wayland-session.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/wayvnc --address=0.0.0.0 --port=5900 --gpu-filter=render
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=default.target
        EOF
      # B. 创建“登录即锁屏”启动项
      - |
        mkdir -p /etc/xdg/autostart/
        cat <<EOF > /etc/xdg/autostart/auto-lock.desktop
        [Desktop Entry]
        Type=Application
        Name=Auto Lock on Login
        Exec=swaylock -c 000000
        OnlyShowIn=Budgie;
        NoDisplay=true
        X-GNOME-Autostart-enabled=true
        EOF
      # C. 注入 Budgie-Labwc 桥接设置 (GSchema Override)
      - |
        mkdir -p /usr/share/glib-2.0/schemas/
        cat <<EOF > /usr/share/glib-2.0/schemas/zz0-budgie-custom.gschema.override
        [org.buddiesofbudgie.budgie-desktop.services.labwc-bridge]
        enabled=true
        manage-decorations=true

        [org.buddiesofbudgie.desktop.wm.preferences]
        button-layout='appmenu:minimize,maximize,close'
        focus-mode='click'
        EOF
        glib-compile-schemas /usr/share/glib-2.0/schemas/

  # ------------------------------------------------------------
  # 4. 服务激活管理 (Systemd)
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - v2raya.service
        - vmtoolsd.service
    user:
      enabled:
        - wayvnc.service

  # ------------------------------------------------------------
  # 5. 应用软件 (Flatpak)
  # ------------------------------------------------------------
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.mozilla.firefox
        - com.google.Chrome
        - org.telegram.desktop
        - com.jianguoyun.Nutstore
        - com.visualstudio.code
