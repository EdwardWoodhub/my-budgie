# ==============================================================================
# 镜像名称: my-custom-budgie-os
# 基础底座: ghcr.io/ublue-os/base-main (Fedora 44 Rawhide)
# 核心目标: Budgie 10.10 原生 Wayland 远程实验室 (UID: 1001)
# ==============================================================================

name: my-custom-budgie-os
description: 适配 Fedora 44 的 Budgie 10.10 环境 (含 WayVNC 鼠标修复)
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # ------------------------------------------------------------
  # 1. 软件源补丁: 强制锁定 v2rayA 到 Fedora 43 仓库 (F44 尚未开仓)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        curl -Lo /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo https://copr.fedorainfracloud.org/coprs/zhullyb/v2rayA/repo/fedora-43/zhullyb-v2rayA-fedora-43.repo
        sed -i 's/\$releasever/43/g' /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo

  # ------------------------------------------------------------
  # 2. 软件包安装: 补全驱动、桌面核心、终端、文件管理器及科研工具
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      # --- 驱动与显示核心 ---
      - xorg-x11-drv-vmware
      - mesa-dri-drivers
      - xorg-x11-server-Xwayland
      - open-vm-tools-desktop
      - glibc-all-langpacks
      # --- 桌面基础设施 ---
      - sddm
      - polkit
      - gnome-keyring
      - desktop-backgrounds-basic
      - budgie-desktop            # 10.10 核心
      - budgie-control-center
      - labwc                     # Wayland 合成器 (10.10 灵魂)
      - libxfce4windowing
      # --- 必装 GUI 工具 ---
      - gnome-terminal            # 终端
      - nautilus                  # 文件管理器
      - gvfs                      # 回收站/挂载支持
      - xdg-user-dirs
      # --- 科研与日常必备 ---
      - gnome-system-monitor
      - gnome-text-editor
      - eog
      - evince                    # PDF 阅读器
      - network-manager-applet
      # --- 远程、网络与辅助 ---
      - wayvnc
      - v2raya
      - firewalld
      - swaylock
      - wl-clipboard
      # --- 基础维护 ---
      - git
      - vim
      - wget
      - htop

  # ------------------------------------------------------------
  # 3. 系统逻辑配置: 强制 Wayland 会话与 GSchema 桥接
  # ------------------------------------------------------------
  - type: script
    snippets:
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      - mkdir -p /var/lib/systemd/linger
      - touch /var/lib/systemd/linger/edward
      - |
        # 强制启动 Budgie 10.10 的 Wayland 会话
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop-wayland

        [General]
        DisplayServer=wayland
        EOF
      - sudo -u edward xdg-user-dirs-update || true
      - firewall-offline-cmd --add-service=vnc-server
      - |
        # 注入 10.10 专属的桥接配置
        mkdir -p /usr/share/glib-2.0/schemas/
        cat <<EOF > /usr/share/glib-2.0/schemas/zz0-budgie-custom.gschema.override
        [org.buddiesofbudgie.budgie-desktop.services.labwc-bridge]
        enabled=true
        [org.buddiesofbudgie.desktop.wm.preferences]
        button-layout='appmenu:minimize,maximize,close'
        EOF
        glib-compile-schemas /usr/share/glib-2.0/schemas/

  # ------------------------------------------------------------
  # 4. 创建用户服务: WayVNC (针对 UID 1001 与 鼠标显示优化)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC Service (Cursor Fix for F44)
        After=wayland-session.target

        [Service]
        Type=simple
        # 核心修正：针对 1001 用户和 VMware 鼠标不可见问题
        Environment=WAYLAND_DISPLAY=wayland-0
        Environment=XDG_RUNTIME_DIR=/run/user/1001
        Environment=WLR_NO_HARDWARE_CURSORS=1
        
        # 核心修正：添加 --render-cursor 确保 VNC 画面显示鼠标
        ExecStart=/usr/bin/wayvnc --address 0.0.0.0 --port 5900 --render-cursor
        
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=default.target
        EOF

  # ------------------------------------------------------------
  # 5. 激活服务
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - sddm.service
        - v2raya.service
        - vmtoolsd.service
        - firewalld.service
    user:
      enabled:
        - wayvnc.service
