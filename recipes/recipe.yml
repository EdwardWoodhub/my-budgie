# ==============================================================================
# 镜像名称: my-custom-budgie-os
# 目标: 彻底放弃 Nautilus，改用更稳的 Thunar，修复 Files 打不开的顽疾
# ==============================================================================

name: my-custom-budgie-os
description: Fedora 44 + Budgie 10.10 (Thunar 稳定版)
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # ------------------------------------------------------------
  # 1. 软件源: 锁定 F43 仓库
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        curl -Lo /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo https://copr.fedorainfracloud.org/coprs/zhullyb/v2rayA/repo/fedora-43/zhullyb-v2rayA-fedora-43.repo
        sed -i 's/\$releasever/43/g' /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo

  # ------------------------------------------------------------
  # 2. 软件包: 换装 Thunar 系列
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      - xorg-x11-drv-vmware
      - mesa-dri-drivers
      - xorg-x11-server-Xwayland
      - open-vm-tools-desktop
      - sddm
      - polkit
      - budgie-desktop
      - budgie-control-center
      - labwc
      - adwaita-cursor-theme
      # --- 抛弃 Nautilus，换装 Thunar ---
      - thunar                    # 核心文件管理器
      - thunar-archive-plugin     # 右键压缩/解压
      - thunar-volman             # 自动挂载 U 盘
      - tumbler                   # 图片缩略图支持
      - gvfs-archive              # 档案文件预览
      - gvfs-smb                  # 局域网共享支持
      # --- 生产力 ---
      - pluma                     # 文本编辑器 (比 gedit 更稳)
      - gnome-terminal
      - syncthing
      - wayvnc
      - v2raya
      - firewalld
      - git
      - htop

  # ------------------------------------------------------------
  # 3. 系统配置: 环境变量注入
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        echo "WLR_NO_HARDWARE_CURSORS=1" >> /etc/environment
        echo "XDG_CURRENT_DESKTOP=Budgie:GNOME" >> /etc/environment
        echo "XDG_SESSION_TYPE=wayland" >> /etc/environment
      
      - mkdir -p /var/lib/systemd/linger
      - touch /var/lib/systemd/linger/edward
      - touch /var/lib/systemd/linger/bob
      
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop-wayland
        [General]
        DisplayServer=wayland
        EOF

      - |
        # 注入 10.10 桥接配置
        mkdir -p /usr/share/glib-2.0/schemas/
        cat <<EOF > /usr/share/glib-2.0/schemas/zz0-budgie-custom.gschema.override
        [org.buddiesofbudgie.budgie-desktop.services.labwc-bridge]
        enabled=true
        [org.gnome.desktop.interface]
        cursor-theme='Adwaita'
        EOF
        glib-compile-schemas /usr/share/glib-2.0/schemas/

  # ------------------------------------------------------------
  # 4. 动态用户服务 (WayVNC 与 Syncthing)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        # WayVNC
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC Service
        After=wayland-session.target
        [Service]
        Type=simple
        Environment=WAYLAND_DISPLAY=wayland-0
        Environment=XDG_RUNTIME_DIR=%t
        ExecStartPre=/usr/bin/dbus-update-activation-environment --all
        ExecStart=/usr/bin/wayvnc --address 0.0.0.0 --port 5900 --render-cursor
        Restart=always
        RestartSec=10
        [Install]
        WantedBy=default.target
        EOF

        # Syncthing (锁定 8384)
        cat <<EOF > /usr/lib/systemd/user/syncthing.service
        [Unit]
        Description=Syncthing Service
        After=network.target
        [Service]
        Environment=HOME=%h
        ExecStartPre=/usr/bin/mkdir -p %h/.config/syncthing
        ExecStart=/usr/bin/syncthing serve --no-browser --no-restart --gui-address=127.0.0.1:8384
        Restart=on-failure
        RestartSec=5
        [Install]
        WantedBy=default.target
        EOF

  # ------------------------------------------------------------
  # 5. 激活服务
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - sddm.service
        - v2raya.service
        - vmtoolsd.service
        - firewalld.service
    user:
      enabled:
        - wayvnc.service
        - syncthing.service
