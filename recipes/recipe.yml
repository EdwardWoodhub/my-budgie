name: my-custom-budgie-os
description: 修复了黑屏光标问题，补全了虚拟机驱动与桌面基础设施
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # 1. 软件源阶段
  - type: script
    snippets:
      - dnf -y copr enable zhullyb/v2rayA

  # 2. 补全缺失的“隐蔽工程”包
  - type: rpm-ostree
    install:
      # --- 关键：硬件与驱动补丁 ---
      - xorg-x11-drv-vmware       # VMware 显卡驱动
      - mesa-dri-drivers
      - xorg-x11-server-Xwayland
      - glibc-all-langpacks       # 解决语言/字符集导致的崩溃
      
      # --- 关键：桌面基础设施 (没有它们，桌面起不来) ---
      - sddm
      - polkit                    # 权限管理
      - gnome-keyring             # 密码存储 (Budgie 启动必须)
      - desktop-backgrounds-basic # 基础壁纸，防止渲染黑块
      
      # --- Budgie 核心 ---
      - budgie-desktop
      - budgie-control-center
      - labwc
      - libxfce4windowing
      
      # --- 工具与服务 ---
      - wayvnc
      - swaylock
      - open-vm-tools-desktop
      - v2raya
      - firewalld
      - git
      - vim
      - wget

  # 3. 系统配置脚本
  - type: script
    snippets:
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      - mkdir -p /var/lib/systemd/linger
      - touch /var/lib/systemd/linger/edward
      
      # 强制 SDDM 运行在 Wayland 模式的配置
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop

        [General]
        DisplayServer=wayland
        EOF

      - firewall-offline-cmd --add-service=vnc-server

      # 注入 GSchema 桥接
      - |
        mkdir -p /usr/share/glib-2.0/schemas/
        cat <<EOF > /usr/share/glib-2.0/schemas/zz0-budgie-custom.gschema.override
        [org.buddiesofbudgie.budgie-desktop.services.labwc-bridge]
        enabled=true
        [org.buddiesofbudgie.desktop.wm.preferences]
        button-layout='appmenu:minimize,maximize,close'
        EOF
        glib-compile-schemas /usr/share/glib-2.0/schemas/

  # 4. 用户服务
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC for Budgie
        After=wayland-session.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/wayvnc --address=0.0.0.0 --port=5900 --gpu-filter=render
        Restart=always
        EOF

  # 5. 激活服务
  - type: systemd
    system:
      enabled:
        - sddm.service
        - v2raya.service
        - vmtoolsd.service
        - firewalld.service
    user:
      enabled:
        - wayvnc.service
