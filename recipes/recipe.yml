# ==============================================================================
# 镜像名称: my-custom-budgie-os
# 目标: 修复 Files/gedit，集成 Pluma/Syncthing，完善 D-Bus 握手
# ==============================================================================

name: my-custom-budgie-os
description: Fedora 44 + Budgie 10.10 (全功能科研版)
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # ------------------------------------------------------------
  # 1. 软件源: 锁定 F43 仓库 (v2rayA 专用)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        curl -Lo /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo https://copr.fedorainfracloud.org/coprs/zhullyb/v2rayA/repo/fedora-43/zhullyb-v2rayA-fedora-43.repo
        sed -i 's/\$releasever/43/g' /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo

  # ------------------------------------------------------------
  # 2. 软件包: 补全 Portal、Pluma、Syncthing
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      # --- 显示与驱动 ---
      - xorg-x11-drv-vmware
      - mesa-dri-drivers
      - xorg-x11-server-Xwayland
      - open-vm-tools-desktop
      # --- 桌面核心与桥接 ---
      - sddm
      - polkit
      - budgie-desktop
      - budgie-control-center
      - labwc
      - adwaita-cursor-theme
      # --- 关键：解决应用打不开的“药引子” ---
      - xdg-desktop-portal-gtk    # 让 Files/gedit 找到授权
      - dbus-x11                  # 传统的 D-Bus 工具补全
      # --- 生产力应用 ---
      - gnome-terminal
      - nautilus                  # Files
      - gedit                     # GNOME 编辑器
      - pluma                     # MATE 编辑器 (备用，极稳)
      - syncthing                 # 文件同步
      - gvfs
      - v2raya
      - wayvnc
      - git
      - htop

  # ------------------------------------------------------------
  # 3. 系统配置: 注入环境变量与 D-Bus 修正
  # ------------------------------------------------------------
  - type: script
    snippets:
      # --- 全局变量: 解决鼠标隐身与应用启动身份问题 ---
      - |
        echo "WLR_NO_HARDWARE_CURSORS=1" >> /etc/environment
        echo "XDG_CURRENT_DESKTOP=Budgie:GNOME" >> /etc/environment
        echo "XDG_SESSION_TYPE=wayland" >> /etc/environment

      # --- Linger & 网络 ---
      - mkdir -p /var/lib/systemd/linger
      - touch /var/lib/systemd/linger/edward
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      
      # --- SDDM Autologin ---
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop-wayland
        [General]
        DisplayServer=wayland
        EOF

      # --- 防火墙放行 (VNC + Syncthing) ---
      - firewall-offline-cmd --add-service=vnc-server
      - firewall-offline-cmd --add-port=22000/tcp --add-port=21027/udp

  # ------------------------------------------------------------
  # 4. 用户服务: WayVNC 与 Syncthing (针对 UID 1001)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        # --- WayVNC 服务 (集成 D-Bus 唤醒逻辑) ---
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC Service with D-Bus Sync
        After=wayland-session.target

        [Service]
        Type=simple
        Environment=WAYLAND_DISPLAY=wayland-0
        Environment=XDG_RUNTIME_DIR=/run/user/1001
        # 启动前强制同步环境变量，这是修复 Files/gedit 的关键
        ExecStartPre=/usr/bin/dbus-update-activation-environment --all
        ExecStart=/usr/bin/wayvnc --address 0.0.0.0 --port 5900 --render-cursor
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=default.target
        EOF

        # --- Syncthing 用户服务 ---
        cat <<EOF > /usr/lib/systemd/user/syncthing.service
        [Unit]
        Description=Syncthing - Personal Data Service
        After=network.target

        [Service]
        ExecStart=/usr/bin/syncthing serve --no-browser --no-restart
        Restart=on-failure
        SuccessExitStatus=3 4
        RestartSec=1

        [Install]
        WantedBy=default.target
        EOF

  # ------------------------------------------------------------
  # 5. 激活服务
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - sddm.service
        - v2raya.service
        - vmtoolsd.service
        - firewalld.service
    user:
      enabled:
        - wayvnc.service
        - syncthing.service
