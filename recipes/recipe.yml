# ==============================================================================
# 镜像名称: my-budgie-onyx-vm
# 目标架构: Budgie 10.10 + Labwc (Wayland)
# 核心功能: 虚拟机开机即自动登录、后台运行 WayVNC、自动锁屏、网络自治
# ==============================================================================

name: my-budgie-onyx-vm
description: 专为 VMware 优化的 Budgie 10.10 自动远程办公系统
base-image: ghcr.io/ublue-os/onyx-main
image-version: latest

modules:
  # ------------------------------------------------------------
  # 1. 基础系统脚本：网络、防火墙与用户状态管理
  # ------------------------------------------------------------
  - type: script
    snippets:
      # A. 启用 v2rayA 源并开启 IP 转发
      - dnf -y copr enable zhullyb/v2rayA
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      
      # B. 开启用户驻留 (Linger)
      # 重要：将 'user' 替换为你实际的系统用户名。这允许用户服务在开机阶段即启动。
      - loginctl enable-linger user

      # C. 配置 SDDM 自动登录 (将 'user' 替换为你实际的用户名)
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=user
        Session=budgie-desktop
        EOF

      # D. 防火墙策略：放行 VNC (5900 端口)
      - firewall-offline-cmd --add-service=vnc-server

  # ------------------------------------------------------------
  # 2. 软件包安装 (rpm-ostree)
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      # --- Budgie 10.10 & Labwc 核心堆栈 ---
      - labwc
      - budgie-desktop-services    # 包含关键的 labwc-bridge 逻辑
      - libxfce4windowing          # 解决图标匹配问题的关键库
      - xdg-desktop-portal-wlr     # Wayland 门户协议支持
      
      # --- 远程访问与安全 ---
      - wayvnc                     # VNC 服务端
      - control-port               # wayvnc 控制工具
      - swaylock                   # 自动锁屏工具
      - grim                       # 截图工具
      - slurp                      # 选区工具
      - wl-clipboard               # 剪贴板管理

      # --- 虚拟机与网络 ---
      - open-vm-tools
      - open-vm-tools-desktop
      - v2raya
      - trojan
      - iptables
      - ipset

      # --- 基础工具 ---
      - git
      - vim
      - wget
      - htop
      - fastfetch

  # ------------------------------------------------------------
  # 3. 配置文件注入 (通过脚本生成，避免路径冲突)
  # ------------------------------------------------------------
  - type: script
    snippets:
      # A. 创建 WayVNC 用户服务
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC server for Budgie-Labwc
        After=wayland-session.target

        [Service]
        Type=simple
        # 针对 VMware 优化：使用 --gpu-filter=render 降低延迟
        ExecStart=/usr/bin/wayvnc --address=0.0.0.0 --port=5900 --gpu-filter=render
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=default.target
        EOF

      # B. 创建“登录即锁屏”脚本
      - |
        mkdir -p /etc/xdg/autostart/
        cat <<EOF > /etc/xdg/autostart/auto-lock.desktop
        [Desktop Entry]
        Type=Application
        Name=Auto Lock on Login
        Exec=swaylock -c 000000
        OnlyShowIn=Budgie;
        NoDisplay=true
        X-GNOME-Autostart-enabled=true
        EOF

  # ------------------------------------------------------------
  # 4. 服务激活管理 (Systemd)
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - v2raya.service
        - vmtoolsd.service
    user:
      enabled:
        - wayvnc.service

  # ------------------------------------------------------------
  # 5. UI 预设 (GSettings)
  # ------------------------------------------------------------
  - type: gsettings
    overrides:
      # 必须：开启 Budgie 10.10 的 Labwc 桥接
      org.buddiesofbudgie.budgie-desktop.services.labwc-bridge:
        enabled: true
        manage-decorations: true
      # 个人习惯预设
      org.buddiesofbudgie.desktop.wm.preferences:
        button-layout: 'appmenu:minimize,maximize,close'
        focus-mode: 'click'

  # ------------------------------------------------------------
  # 6. Flatpaks 应用分发
  # ------------------------------------------------------------
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.mozilla.firefox
        - com.google.Chrome
        - org.telegram.desktop
        - com.jianguoyun.Nutstore
        - com.visualstudio.code
