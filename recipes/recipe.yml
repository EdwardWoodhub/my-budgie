name: my-custom-budgie-os
description: 基于 Fedora 44 (Rawhide) 的 Budgie 10.10 Wayland 环境
base-image: ghcr.io/ublue-os/base-main
image-version: 44  # 核心修改：冲刺 Fedora 44 以获取 Budgie 10.10

modules:
  # ------------------------------------------------------------
  # 1. 软件源阶段
  # ------------------------------------------------------------
  - type: script
    snippets:
      - dnf -y copr enable zhullyb/v2rayA

  # ------------------------------------------------------------
  # 2. 软件包阶段 (针对 Wayland 优化)
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      - xorg-x11-drv-vmware       # 驱动
      - mesa-dri-drivers          # 3D 加速核心
      - xorg-x11-server-Xwayland  # 兼容 X11 应用
      - open-vm-tools-desktop     
      - glibc-all-langpacks       
      - sddm
      - polkit
      - gnome-keyring
      - budgie-desktop            # 10.10 核心
      - budgie-control-center
      - labwc                     # Wayland 合成器 (10.10 的灵魂)
      - libxfce4windowing         
      - gnome-terminal            
      - nautilus                  
      - gvfs                      
      - xdg-user-dirs             
      - wayvnc                    # 远程桌面
      - v2raya
      - firewalld
      - swaylock
      - evince                    
      - git
      - vim
      - wget

  # ------------------------------------------------------------
  # 3. 系统配置阶段 (Session 与 权限修复)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
      
      # 暴力开启 Linger (针对 1001 用户)
      - mkdir -p /var/lib/systemd/linger
      - touch /var/lib/systemd/linger/edward
      
      # --- 关键修改：强制启动 Wayland 会话 ---
      - |
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=budgie-desktop-wayland

        [General]
        DisplayServer=wayland
        EOF

      - firewall-offline-cmd --add-service=vnc-server

      # 注入 10.10 的 GSchema 桥接
      - |
        mkdir -p /usr/share/glib-2.0/schemas/
        cat <<EOF > /usr/share/glib-2.0/schemas/zz0-budgie-custom.gschema.override
        [org.buddiesofbudgie.budgie-desktop.services.labwc-bridge]
        enabled=true
        [org.buddiesofbudgie.desktop.wm.preferences]
        button-layout='appmenu:minimize,maximize,close'
        EOF
        glib-compile-schemas /usr/share/glib-2.0/schemas/

  # ------------------------------------------------------------
  # 4. WayVNC 用户服务 (针对 UID 1001 适配)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/wayvnc.service
        [Unit]
        Description=WayVNC Service for Budgie 10.10
        After=wayland-session.target

        [Service]
        Type=simple
        # 核心修正：针对你的 1001 用户环境
        Environment=WAYLAND_DISPLAY=wayland-0
        Environment=XDG_RUNTIME_DIR=/run/user/1001
        
        # 启动命令：去掉可能会导致报错的 GPU 过滤器
        ExecStart=/usr/bin/wayvnc --address 0.0.0.0 --port 5900
        
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=default.target
        EOF

  # ------------------------------------------------------------
  # 5. 激活服务
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - sddm.service
        - v2raya.service
        - vmtoolsd.service
        - firewalld.service
    user:
      enabled:
        - wayvnc.service
